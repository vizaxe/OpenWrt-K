# nginx 本地自管配置（uci_enable=false 时生效）
#
# 为什么关掉 uci 管理：/etc/init.d/nginx 的 nginx_init() 会先执行
# `nginx-util init_lan`，再按「/etc/nginx/uci.conf 是否存在」决定用哪个配置：
#   - 存在（uci 模式生成物）-> 用它
#   - 不存在               -> 用本文件 /etc/nginx/nginx.conf
# 而 init_lan() 只会在 uci_enable=true 时才生成 /var/lib/nginx/uci.conf，
# 所以设 uci_enable=false 后本文件即接管（详见 uci-defaults/zzz-nginx）。
#
# 包自带的默认 UCI 配置会监听 80 与 443（server '_redirect2ssl' + server '_lan'），
# 本文件**不监听 80/443**，仅用于自定义端口的反向代理。

# 第三方 / 官方模块的加载指令（由 nginx-mod-* 包安装到 module.d/，
# 例如 nginx-mod-stream 提供的 stream.module 内含 ngx_stream_module.so 的 load_module）。
# 必须位于顶层；缺少它时后面 stream {} 会报「unknown directive」。
include module.d/*.module;

user root;
worker_processes auto;

error_log /var/log/nginx/error.log;
# pid 必须与 /etc/init.d/nginx 的 reload 判定一致（该脚本读取 /var/run/nginx.pid）
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	access_log off;
	log_format openwrt '$request_method $scheme://$host$request_uri => $status'
		' (${body_bytes_sent}B in ${request_time}s) <- $http_referer';

	include mime.types;
	default_type application/octet-stream;
	sendfile on;

	client_max_body_size 128M;
	large_client_header_buffers 2 1k;

	gzip on;
	gzip_vary on;
	gzip_proxied any;

	# HTTP/HTTPS 反向代理的 server 块放这里：
	#   /etc/nginx/conf.d/<名字>.conf
	include conf.d/*.conf;
}

stream {
	# TCP/UDP 反向代理的 server 块放这里：
	#   /etc/nginx/stream.d/<名字>.conf
	# 注意：stream 只能位于顶层，不能写进 http {} 里（conf.d/ 是 http 级 include）。
	# 目录不存在或为空都不会报错（nginx 对无匹配的通配 include 不报错）。
	include stream.d/*.conf;
}
